name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck · lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  desktop:
    name: Desktop (${{ matrix.os }} · Py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12",  "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Import smoke test
        run: python -c "import agentdesk.tools as t; print(len(t.definitions()), 'tools')"

  tokenizer:
    name: Tokenizer fixture check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vocabulary artifact is present
        run: |
          test -s src/services/tokenizer/dsv4-merges.txt
          head -c 1 src/services/tokenizer/dsv4-merges.txt > /dev/null
          echo "vocabulary size: $(wc -c < src/services/tokenizer/dsv4-merges.txt) bytes"
